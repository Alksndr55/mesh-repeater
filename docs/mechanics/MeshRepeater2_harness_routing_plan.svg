<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><rect width="1500" height="1000" fill="white"/><g font-family="Arial, sans-serif"><text x="45" y="45" font-size="27" fill="#263746">Mesh Repeater 2.0 — проектный маршрут межплатного кабеля</text><text x="45" y="77" font-size="18" fill="#263746">Боковое сечение около X=70,5 мм; северная кромка всех плат — физическая Y=0.</text><text x="45" y="107" font-size="18" fill="#263746">Положение кабеля условное: размер ответной сборки и глубина вставки подтверждаются образцом.</text><rect x="400" y="741.76" width="600" height="18.24000000000001" fill="#3e8766" stroke="#52606b"/><rect x="400" y="501.52" width="600" height="18.24000000000001" fill="#a59a6c" stroke="#52606b"/><rect x="400" y="291.28" width="600" height="18.24000000000001" fill="#4476a5" stroke="#52606b"/><rect x="372.0" y="632.56" width="88.0" height="109.20000000000005" fill="#8b949e" stroke="#52606b"/><rect x="372.0" y="309.52" width="88.0" height="109.19999999999999" fill="#8b949e" stroke="#52606b"/><text x="490" y="700" font-size="18" fill="#263746">J101 POWER: native (64,15;11), 90°</text><text x="490" y="388" font-size="18" fill="#263746">J201 LOGIC: native (76,85;49), 270°</text><text x="600" y="490.0" font-size="18" fill="#263746">SHIELD без вырезов</text><text x="470" y="282.40000000000003" font-size="18" fill="#263746">LOGIC — компоненты вниз</text><text x="470" y="793.6" font-size="18" fill="#263746">POWER — компоненты вверх</text><path d="M372.0,687.16 L220,687.16 L216.07704521360776,686.9750400239877 L212.17827674798843,686.4213004357083 L208.3277318072047,685.5021952238606 L204.54915028125265,684.2233909777092 L200.8658283817455,682.5927719506772 L197.30047501302266,680.6203914513021 L193.87507176420257,678.3184098612455 L190.61073738537632,675.7010196624968 L187.52759758349083,672.7843579360018 L184.64466094067262,669.5864068711928 L181.97970171999845,666.126882899811 L179.54915028125265,662.4271151375484 L177.3679917822954,658.5099138829569 L175.4496737905816,654.3994299843728 L173.80602337443565,650.1210059419054 L172.44717418524232,645.7010196624968 L171.38150398011618,641.1667218313544 L170.6155829702431,636.5460679024138 L170.1541333133436,631.8675457436707 L170.0,627.16 L170,424.12 L170.1541333133436,419.41245425632934 L170.6155829702431,414.73393209758615 L171.38150398011618,410.1132781686457 L172.44717418524232,405.5789803375032 L173.80602337443565,401.1589940580946 L175.4496737905816,396.8805700156272 L177.3679917822954,392.7700861170431 L179.54915028125265,388.8528848624516 L181.97970171999845,385.153117100189 L184.64466094067262,381.69359312880715 L187.52759758349083,378.49564206399816 L190.61073738537632,375.57898033750314 L193.87507176420257,372.96159013875445 L197.30047501302266,370.659608548698 L200.8658283817455,368.6872280493228 L204.54915028125265,367.05660902229084 L208.3277318072047,365.7778047761394 L212.17827674798843,364.8586995642917 L216.07704521360773,364.30495997601236 L220.0,364.12000000000006 L372.0,364.12" fill="none" stroke="#2573ae" stroke-width="5"/><path d="M400,778.0 L400,262.0" fill="none" stroke="#b5bec5" stroke-width="1" stroke-dasharray="6 5"/><text x="200" y="496" font-size="18" fill="#2573ae">Петля кабеля</text><text x="200" y="532" font-size="18" fill="#2573ae">Y ≤ −23 мм</text><text x="200" y="568" font-size="18" fill="#2573ae">изгиб ≥5 мм</text><text x="1040" y="195" font-size="22" fill="#263746">Кабель строго 1:1</text><text x="1040" y="230" font-size="18" fill="#263746">1/3/5/7: FILTER_OUT</text><text x="1040" y="258" font-size="18" fill="#263746">2/4/6/8/10/12: GND</text><text x="1040" y="286" font-size="18" fill="#263746">9: BAT (sense)</text><text x="1040" y="314" font-size="18" fill="#263746">11: MODE</text><text x="1040" y="360" font-size="18" fill="#263746">SYS_3V3 отсутствует</text><text x="1040" y="410" font-size="18" fill="#263746">Полуоборот шлейфа</text><text x="1040" y="438" font-size="18" fill="#263746">или 1:1 жгут проводов</text><text x="1040" y="480" font-size="18" fill="#263746">Длина 120 мм</text><text x="1040" y="508" font-size="18" fill="#263746">предварительная</text><text x="45" y="865" font-size="18" fill="#263746">Контроль на образце: посадка обеих IDC, глубина контакта, strain-relief, отсутствие натяжения и прозвонка всех 12 жил.</text><text x="45" y="898" font-size="18" fill="#263746">13,3 мм в DS1016 — размер отдельной Top cover, а не подтверждённая длина окончательной ответной сборки.</text><text x="45" y="931" font-size="18" fill="#263746">Выбранный шлейф Connfly DS1057 имеет паспорт −20…+70°C. Более низкая температура требует другого кабеля.</text></g></svg>